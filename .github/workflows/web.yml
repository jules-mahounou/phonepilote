name: Site (phonepilote.xydhub.tech)

on:
  workflow_dispatch:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.FTP_DIR }}
      SITE_URL: ${{ vars.SITE_URL || 'https://phonepilote.xydhub.tech' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      ACCOUNT_DOMAIN: ${{ vars.ACCOUNT_DOMAIN || 'phonepilote.xydhub.tech' }}
    steps:
      - uses: actions/checkout@v4

      # Espace admin : seule la clé anon (publique) est injectée ; l'accès aux données est filtré par RLS.
      - name: Configuration de /admin
        run: |
          URL="${SUPABASE_URL%/}"
          if [ -z "$URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY absents : /admin affichera « non configuré »."; fi
          export URL
          for f in web/admin/config.js web/admin/.htaccess; do
            perl -pi -e 's/__SUPABASE_URL__/$ENV{URL}/g; s/__SUPABASE_ANON_KEY__/$ENV{SUPABASE_ANON_KEY}/g; s/__ACCOUNT_DOMAIN__/$ENV{ACCOUNT_DOMAIN}/g' "$f"
          done

      - name: Upload FTP
        run: |
          if [ -z "$FTP_HOST" ]; then echo "::warning::Secrets FTP absents : site non déployé."; exit 0; fi
          DIR="${FTP_DIR#/}"; DIR="${DIR%/}"; [ "$DIR" = "." ] && DIR=""
          up() { curl -sS --fail --ftp-create-dirs --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "ftp://$FTP_HOST/${DIR:+$DIR/}$2"; }
          up web/index.html index.html
          up web/.htaccess .htaccess
          up web/logo.png logo.png
          up web/favicon.png favicon.png
          for f in index.html app.js admin.css config.js .htaccess; do up "web/admin/$f" "admin/$f"; done
          echo "Site : $SITE_URL — Admin : $SITE_URL/admin/"
