name: Backend (Supabase)

on:
  workflow_dispatch:
  push:
    paths: ["supabase/**", ".github/workflows/backend.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      # Comptes administrateurs (variable ou secret) : numéros ou emails séparés par des virgules. Vide = liste inchangée.
      ADMIN_PHONES: ${{ vars.ADMIN_PHONES || secrets.ADMIN_PHONES }}
      ACCOUNT_DOMAIN: ${{ vars.ACCOUNT_DOMAIN || 'phonepilote.xydhub.tech' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN (secret) et SUPABASE_PROJECT_REF (variable) absents : déploiement ignoré."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      # Les migrations sont idempotentes : on les rejoue toutes via l'API Management (pas besoin du mot de passe DB).
      - name: Migrations SQL
        if: env.SKIP != '1'
        run: |
          q() {
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -Rs '{query: .}')"
          }
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            q < "$f" > /dev/null || { echo "::error::Échec de $f (le jeton doit avoir l'accès base de données en écriture)"; exit 1; }
          done
          echo "Migrations appliquées."

      # La variable ADMIN_PHONES est la source de vérité : retirer un numéro retire ses droits.
      - name: Administrateurs
        if: env.SKIP != '1' && env.ADMIN_PHONES != ''
        run: |
          LIST=""
          IFS=',' read -ra ITEMS <<< "$ADMIN_PHONES"
          for raw in "${ITEMS[@]}"; do
            v=$(echo "$raw" | tr -d '[:space:]' | tr 'A-Z' 'a-z')
            [ -z "$v" ] && continue
            if [[ "$v" != *@* ]]; then
              d=$(echo "$v" | tr -cd '0-9'); d="${d#00}"
              if [[ "$d" != 229* ]] || [ ${#d} -le 10 ]; then d="229$d"; fi
              v="$d@$ACCOUNT_DOMAIN"
            fi
            if ! [[ "$v" =~ ^[a-z0-9._+-]+@[a-z0-9.-]+$ ]]; then echo "::error::Entrée ADMIN_PHONES invalide : $raw"; exit 1; fi
            LIST="$LIST${LIST:+,}'$v'"
          done
          [ -z "$LIST" ] && { echo "Aucun administrateur valide."; exit 0; }
          SQL="insert into public.admins(user_id) select id from auth.users where lower(email) in ($LIST) on conflict do nothing;
               delete from public.admins where user_id not in (select id from auth.users where lower(email) in ($LIST));
               select u.email from public.admins a join auth.users u on u.id = a.user_id;"
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query: $q}')"
          echo ""
          echo "Administrateurs mis à jour (un numéro sans compte PhonePilote est ignoré : créez d'abord le compte dans l'app)."
